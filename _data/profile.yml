short_bio: >-
  <p>
    Hi, there! I'm Zhe Wang, a first year Ph.D. student at University of Illinois at Urbana-Champaign, majoring in Computer Science. I am fortuantely advised by Prof. <a href="https://lingming.cs.illinois.edu">Lingming Zhang</a>.
    <br/>
    Before coming to UIUC, I completed my undergraduate study at Tsinghua University, majoring in Mathematics and Physics.
  </p>
  <h5 class="mt-4 research-interests-heading">Research Interests</h5>
  <div>
      <p>
        My research interest lies in the intersection of Artificial Intelligence and Software Engineering. More specifically:
      </p>
      <ul>
        <li><strong class="gradient-text-light" style="font-size: 1.1em;">LLMs for Code:</strong> to develop LLMs for code through post-training via reasoning <a href="/#purpcode-reasoning-for-safer-code-generation">[PurpCode]</a> and data-centric alignment <a href="/#magicoder-empowering-code-generation-with-oss-instruct">[Magicoder]</a></li>
        <li><strong class="gradient-text-light" style="font-size: 1.1em;">AI Cybersecurity:</strong> to enhance the trustworthiness, reliability and security of software systems against cyberactivity attacks <a href="/#purpcode-reasoning-for-safer-code-generation">[PurpCode]</a></li>
        <li><strong class="gradient-text-light" style="font-size: 1.1em;">Agents for Software Engineering:</strong> to empower LLM agents with the capability of collaborating <a href="/#multiagentbench-evaluating-the-collaboration-and-competition-of-llm-agents">[MultiAgentBench]</a> and self-evolving <a href="/#live-swe-agent-can-software-engineering-agents-self-evolve-on-the-fly?">[Live-SWE-agent]</a> for real-world software engineering tasks</li>
      </ul>
  </div>
  <p>
    Feel free to drop me an email if you are interested in my research or have any questions. Please find my detailed Curriculum Vitae below:
  </p>

