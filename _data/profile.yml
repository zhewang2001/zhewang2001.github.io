short_bio: >-
  <p>
    Hi, there! I'm Zhe Wang, a second year M.S. student at University of Illinois at Urbana-Champaign, majoring in Computer Science. I am advised by Prof. <a href="https://lingming.cs.illinois.edu">Lingming Zhang</a>. Before coming to UIUC, I completed my undergraduate study at Tsinghua University, majoring in Mathematics and Physics.
  </p>
  <details open>
    <summary><b><span class="gradient-text" style="font-size: 1.4em;">Research Interests</span></b></summary>
    <div>
      <p>
        My research interest lies in the intersection of Artificial Intelligence and Software Engineering. More specifically:
      </p>
      <ul>
        <li><strong class="gradient-text-light" style="font-size: 1.1em;">LLMs for Code:</strong> to develop LLMs to solve software engineering tasks through post-training via synthetic data <a href="/#magicoder-empowering-code-generation-with-oss-instruct">[Magicoder]</a></li>
        <li><strong class="gradient-text-light" style="font-size: 1.1em;">LLM Applications:</strong> to empower LLMs with reasoning, planning and collaboration capabilities through alignment training <a href="/#purpcode-reasoning-for-safer-code-generation">[PurpCode]</a> and agent-based systems <a href="/#multiagentbench-evaluating-the-collaboration-and-competition-of-llm-agents">[MultiAgentBench]</a></li>
        <li><strong class="gradient-text-light" style="font-size: 1.1em;">Trustworthy LLMs:</strong> to enhance trustworthiness, resilience and reliability of helpful-only LLMs against vulnerable code and malicious cyberactivity attacks <a href="/#purpcode-reasoning-for-safer-code-generation">[PurpCode]</a></li>
      </ul>
    </div>
  </details>
  <p>
    <span style="color:rgb(215, 84, 84); font-weight: bold;">I am currently seeking for an Ph.D. position starting from Fall 2026.</span> Feel free to drop me an email if you are interested in my research or have any questions. Please find my detailed Curriculum Vitae below:
  </p>

